<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List a Book - Book Paglu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Book Paglu</h1>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="books.html">Browse Books</a>
            <a href="list-book.html" aria-current="page">List a Book</a>
        </nav>
    </header>

    <main>
        <section class="welcome">
            <h2>Share a book with your campus</h2>
            <p>Fill in the details below to offer a book for exchange or sharing.</p>
        </section>

        <section class="listing-section">
            <div class="section-title">
                <h2 id="form-heading">Book Listing Form</h2>
                <button id="heading-size-button" type="button">Change heading size</button>
            </div>
            <button id="toggle-form-button" type="button" aria-expanded="true" aria-controls="listing-form">Hide form</button>
           <div id="form-container">
            <form id="listing-form" novalidate>
                <div class="form-field">
                    <label for="student-name">Student Name</label>
                    <input id="student-name" name="studentName" type="text" required>
                </div>
                <div class="form-field">
                    <label for="book-title">Book Title</label>
                    <input id="book-title" name="bookTitle" type="text" required>
                </div>
                <div class="form-field">
                    <label for="author">Author</label>
                    <input id="author" name="author" type="text" required>
                </div>
                <div class="form-field">
                    <label for="category">Subject/Category</label>
                    <input id="category" name="category" type="text" required>
                </div>
                <div class="form-field">
                    <label for="condition">Book Condition</label>
                    <select id="condition" name="condition" required>
                        <option value="">Choose a condition</option>
                        <option value="Like new">Like new</option>
                        <option value="Good">Good</option>
                        <option value="Acceptable">Acceptable</option>
                    </select>
                </div>
                <button type="submit">Submit</button>
                <p id="form-message" aria-live="polite"></p>
            </form>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
